# ============================================================================
# dsh-screenshot 的 bundle patch —— 把截图插件挂进 DSH 配置树
# ============================================================================
#
# - insert：往配置树里添加插件行（entry）
# - id 必须全局唯一且与包名一致（STORE 按 entryIds 比对）
# - id 行绝不能写行尾注释（商城预检正则要求值后直接换行）
# - name: 'dsh-screenshot' 解析到包入口 lib/index.js（宿主半）
# - package.json 声明了 dsh.client，模块系统同时提供
#   /plugins/dsh-screenshot/client.js 给浏览器半
#
# ============================================================================

- insert:
    - id: dsh-screenshot
      name: 'dsh-screenshot'
